# =============================================================================
# Data Validation Rules — pawn-cluster
# =============================================================================
# Define expected schema and quality checks for the ingested dataset.
# The validation engine reads this file and rejects datasets that fail.

# Required columns (must exist in the dataset)
required_columns:
  - sepal_length
  - sepal_width
  - petal_length
  - petal_width
  - target

# Column type expectations
column_types:
  sepal_length: float64
  sepal_width: float64
  petal_length: float64
  petal_width: float64
  target: int64

# Range checks (min/max inclusive)
range_checks:
  sepal_length:
    min: 0.0
    max: 15.0
  sepal_width:
    min: 0.0
    max: 10.0
  petal_length:
    min: 0.0
    max: 15.0
  petal_width:
    min: 0.0
    max: 10.0

# Maximum allowed percentage of missing values per column (0-100)
max_missing_pct: 5.0

# Minimum number of rows required
min_rows: 10
